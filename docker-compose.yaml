services:
  # Dependant services
  ## Database (MongoDB) server
  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: testtest
    ports: 
      - 27017:27017
    volumes:
      - data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh mongodb:27017/test -u admin -p testtest --authenticationDatabase admin --quiet
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 2s

  ## Database (MongoDB) GUI
  mongo-express:
    image: mongo-express
    environment:
      - ME_CONFIG_OPTIONS_EDITORTHEME=dracula
      - ME_CONFIG_BASICAUTH=false
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
      - ME_CONFIG_MONGODB_AUTH_USERNAME=admin
      - ME_CONFIG_MONGODB_AUTH_PASSWORD=testtest
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - 8081:8081
    healthcheck:
      test: wget --quiet --tries=3 --spider http://mongo-express:8081 || exit 1
      interval: 7s
      timeout: 5s
      retries: 10
      start_period: 2s

  # Servers (host ports 3000-3005)
  rust-server:
    build:
      context: ./rust-server
    environment:
      ROCKET_PORT: 3000
      MONGODB_URI: mongodb://admin:testtest@mongodb:27017
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - 3000:3000

  elysia-server:
    build:
      context: ./elysia-server
    environment:
      LOCAL_API: false
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_USERNAME: admin
      MONGODB_PASSWORD: testtest
      MONGODB_DATABASE: pokemon
      MONGODB_AUTH_SOURCE: admin
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - 3001:3000

  go-server:
    build:
      context: ./go-server
    environment:
      MONGODB_URI: mongodb://admin:testtest@mongodb:27017/?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - 3002:3000

  hono-server:
    build:
      context: ./hono-server
    environment:
      MONGODB_URI: mongodb://admin:testtest@mongodb:27017
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - 3003:3000

  java-server:
    build:
      context: ./java-server
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://admin:testtest@mongodb:27017/pokemon?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - 3004:3000

  effect-server:
    build:
      context: ./effect-server
    environment:
      MONGODB_URI: mongodb://admin:testtest@mongodb:27017
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - 3005:3000

  # Clients (host ports 4001-4007)
  # Browsers call the servers on their localhost ports above. Remix and SvelteKit
  # also fetch on the server, inside the container, so they get BACKEND_URL_* overrides.
  angular-client:
    build:
      context: ./angular-client
    ports:
      - 4001:80

  lit-client:
    build:
      context: ./lit-client
    ports:
      - 4002:80

  mantine-client:
    build:
      context: ./mantine-client
    ports:
      - 4003:80

  react-client:
    build:
      context: ./react-client
    ports:
      - 4004:80

  remix-client:
    build:
      context: ./remix-client
    environment: &server-side-backends
      BACKEND_URL_RUST: http://rust-server:3000
      BACKEND_URL_ELYSIA: http://elysia-server:3000
      BACKEND_URL_GO: http://go-server:3000
      BACKEND_URL_HONO: http://hono-server:3000
      BACKEND_URL_JAVA: http://java-server:3000
    ports:
      - 4005:3000

  svelt-client:
    build:
      context: ./svelt-client
    environment: *server-side-backends
    ports:
      - 4006:4173

  tsrx-client:
    build:
      context: ./tsrx-client
    ports:
      - 4007:80

volumes:
  data: {}
  minio_storage: {}
