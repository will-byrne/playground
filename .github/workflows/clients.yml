name: clients

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: unit (${{ matrix.client }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: [angular-client, lit-client, mantine-client, react-client, remix-client, svelt-client, tsrx-client]
    defaults:
      run:
        working-directory: ${{ matrix.client }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run test

  fixtures:
    name: e2e fixtures match the contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
        working-directory: contract

      - run: bun install --frozen-lockfile
        working-directory: e2e

      - run: bun run check
        working-directory: e2e

  e2e:
    name: e2e (${{ matrix.client }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { client: angular, dir: angular-client }
          - { client: lit, dir: lit-client }
          - { client: mantine, dir: mantine-client }
          - { client: react, dir: react-client }
          - { client: remix, dir: remix-client }
          - { client: svelte, dir: svelt-client }
          - { client: tsrx, dir: tsrx-client }
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Playwright's test runner runs on Node.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: bun install --frozen-lockfile
        working-directory: ${{ matrix.dir }}

      - run: bun install --frozen-lockfile
        working-directory: e2e

      - run: bunx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run the shared e2e suite
        working-directory: e2e
        env:
          CLIENT: ${{ matrix.client }}
        run: bun run test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.client }}
          path: e2e/playwright-report/
          if-no-files-found: ignore
